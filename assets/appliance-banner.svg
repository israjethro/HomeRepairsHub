<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">HomeRepairsHub home appliance services</title>
<desc id="desc">A clean studio lineup of a washing machine, refrigerator, split air conditioner, television, microwave oven and deep freezer in navy, white and orange.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6f7"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f9fbfc"/><stop offset=".5" stop-color="#dce4e8"/><stop offset="1" stop-color="#b8c6cd"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1a3549"/><stop offset="1" stop-color="#081724"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#102536" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="470" rx="24" fill="url(#bg)"/>
<circle cx="1030" cy="80" r="135" fill="#ff790b" opacity=".09"/><circle cx="180" cy="80" r="145" fill="#123e66" opacity=".07"/>
<path d="M0 386 Q280 350 520 386 T1200 372 V470 H0Z" fill="#e8eef0"/>
<path d="M0 410 H1200" stroke="#d3dde1" stroke-width="2"/>
