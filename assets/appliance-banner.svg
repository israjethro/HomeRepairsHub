 <rect x="119" y="20" width="22" height="7" rx="3.5" fill="#9eafb7"/><circle cx="130" cy="48" r="8" fill="#ff790b"/><circle cx="130" cy="48" r="3" fill="#fff"/><rect x="120" y="67" width="20" height="4" rx="2" fill="#8297a2"/><rect x="120" y="79" width="20" height="4" rx="2" fill="#8297a2"/>
</g>
