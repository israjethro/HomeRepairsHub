 <rect x="0" y="0" width="174" height="151" rx="11" fill="#eef3f5"/><path d="M0 151 H174" stroke="#aab9c1" stroke-width="3"/>
 <rect x="147" y="45" width="5" height="76" rx="2.5" fill="#80939e"/><rect x="147" y="180" width="5" height="76" rx="2.5" fill="#80939e"/>
 <path d="M18 22 H115" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/><rect x="0" y="304" width="174" height="12" rx="5" fill="#aebdc5"/>
</g>
