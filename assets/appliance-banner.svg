 <circle cx="145" cy="18" r="6" fill="#8799a4"/><rect x="18" y="48" width="142" height="10" rx="5" fill="#d1dbe0"/>
 <circle cx="89" cy="148" r="66" fill="#b7c5cc" stroke="#f8fbfc" stroke-width="10"/><circle cx="89" cy="148" r="52" fill="url(#glass)"/><path d="M55 145 Q75 113 109 129 T128 160 Q97 193 66 169Z" fill="#7794a5" opacity=".8"/><path d="M60 126 Q89 110 116 137" fill="none" stroke="#e7f0f4" stroke-width="4" stroke-linecap="round"/>
 <rect x="18" y="226" width="142" height="4" rx="2" fill="#c1ccd1"/>
</g>
