<!-- navy/orange accent floor and tiny service marks -->
<rect x="54" y="392" width="1094" height="5" rx="2.5" fill="#102f4b" opacity=".12"/>
<rect x="54" y="392" width="215" height="5" rx="2.5" fill="#ff790b"/>
<g transform="translate(1045 28)"><circle cx="28" cy="28" r="28" fill="#fff" stroke="#e1e7e9" stroke-width="2"/><path d="M17 28 L25 36 40 19" fill="none" stroke="#ff790b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
